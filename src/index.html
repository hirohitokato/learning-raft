<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raft Visualization</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --grid: rgba(148, 163, 184, 0.15);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --leader: #22c55e;
        --follower: #60a5fa;
        --candidate: #fbbf24;
        --suspend: #f87171;
        --active: #34d399;
        --shadow: rgba(15, 23, 42, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
      }

      .app {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 280px;
        width: 100%;
        min-height: 100vh;
      }

      .panel {
        background: rgba(17, 24, 39, 0.95);
        border-right: 1px solid rgba(148, 163, 184, 0.15);
        padding: 16px;
      }

      .panel.right {
        border-left: 1px solid rgba(148, 163, 184, 0.15);
        border-right: none;
      }

      h2, h3 {
        margin: 0 0 12px;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .section {
        margin-bottom: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field label {
        font-size: 12px;
        color: var(--muted);
      }

      .field input, .field select, .field button {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
      }

      .field button {
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .field button:hover {
        border-color: rgba(96, 165, 250, 0.7);
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border-color: transparent;
      }

      .secondary {
        background: rgba(30, 41, 59, 0.8);
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        background: rgba(15, 23, 42, 0.8);
      }

      .topbar h1 {
        font-size: 24px;
        margin: 0;
      }

      .status {
        font-size: 13px;
        color: var(--muted);
      }

      .board-wrap {
        flex: 1;
        padding: 16px;
        display: flex;
        align-items: stretch;
        min-height: 0;
      }

      .board {
        position: relative;
        width: 100%;
        background: radial-gradient(circle at top, rgba(37, 99, 235, 0.15), rgba(15, 23, 42, 0.6)), #0b1120;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 32px var(--shadow);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .node-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .node-row {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 10px;
        padding: 10px;
      }

      .node-row.selected {
        border-color: rgba(96, 165, 250, 0.8);
        box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.5);
      }

      .node-row-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-bottom: 6px;
      }

      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
      }

      .legend span {
        display: inline-flex;
        align-items: center;
      }

      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        color: white;
        font-weight: 700;
      }

      .leader { background: var(--leader); }
      .follower { background: var(--follower); }
      .candidate { background: var(--candidate); color: #111827; }
      .suspend { background: var(--suspend); }
      .active { background: var(--active); color: #062d1d; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel left">
        <div class="section">
          <h2>Simulation</h2>
          <div class="field">
            <label for="nodeCount">Node Count</label>
            <input id="nodeCount" type="number" min="1" max="20" value="5" />
          </div>
          <div class="field">
            <label for="communicationSpeed">Communication Speed (units/ms)</label>
            <input id="communicationSpeed" type="number" min="1" step="1" value="2" />
          </div>
          <div class="field">
            <label for="timeStepMs">Step Duration (ms)</label>
            <input id="timeStepMs" type="number" min="1" step="1" value="5" />
          </div>
          <div class="field">
            <button id="toggleSimulation" class="primary">Start / Pause</button>
          </div>
        </div>

        <div class="section">
          <h2>Nodes</h2>
          <ul id="stateTable" class="node-list"></ul>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>Raft Visualization</h1>
          <div id="clock" class="status">Time: 0ms</div>
        </header>
        <div class="board-wrap">
          <div class="board">
            <canvas id="simCanvas" width="1000" height="700"></canvas>
          </div>
        </div>
      </main>

      <aside class="panel right">
        <div class="section">
          <h3>Node Settings</h3>
          <div id="nodeSettings"></div>
        </div>
      </aside>
    </div>

    <script type="module" src="./ui.ts"></script>
  </body>
</html>
